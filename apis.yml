aid: osmosis
name: Osmosis
description: >-
  Osmosis (Gulp AI Inc.) is a forward-deployed reinforcement-learning platform for
  post-training large language models. Teams implement an AgentWorkflow and a Grader
  in Python, then use the Osmosis CLI and web platform to submit evaluation and
  training runs (GRPO/DAPO, multi-turn tool training) that produce task-specific
  LoRA models which beat foundation models at a fraction of the cost. Osmosis also
  ships an Agent Improvement REST API for storing agent interaction knowledge and
  enhancing agent tasks from past interactions, an open-source Python SDK/CLI
  (osmosis-ai), a TypeScript logging SDK, an open-source MCP server (Osmosis-Apply),
  webhooks, and hosted documentation. Backed by CRV, Felicis, and Paradigm.
